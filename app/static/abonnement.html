<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a3f8a">
<title>ADER LINK · Mon abonnement</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ADER LINK">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="abonnement">
<div class="demo-banner" id="demoBanner" hidden>Démonstration — données fictives</div>
<main>
  <div class="page-head">
    <div>
      <h1>Mon abonnement</h1>
      <p class="subtitle" id="sub">Votre formule ADER LINK, ce qui est compris, et les autres formules.</p>
    </div>
  </div>
  <div class="ab-head" id="head"></div>
  <section class="card" aria-labelledby="fTitle">
    <h2 id="fTitle">Compris dans votre formule</h2>
    <ul class="pl-list" id="feats"></ul>
  </section>
  <h2 class="sub-h">Toutes les formules</h2>
  <div id="plans" class="pl-grid"></div>
  <section class="card" aria-labelledby="hTitle" id="histCard" hidden>
    <h2 id="hTitle">Historique</h2>
    <ul class="sub-hist" id="hist"></ul>
  </section>
</main>

<div class="bs-shade" id="bsShade"></div>
<section class="bs" id="bs" role="dialog" aria-modal="true" aria-labelledby="bsTitle" hidden>
  <div class="bs-head">
    <span class="bs-ico" id="bsIco" aria-hidden="true"></span>
    <h2 id="bsTitle"></h2>
    <button class="icon-btn icon-btn-plain" type="button" id="bsClose" aria-label="Fermer"></button>
  </div>
  <div class="bs-body" id="bsBody"></div>
  <div class="bs-foot" id="bsFoot"></div>
</section>

<script src="/static/shell.js"></script>
<script src="/static/abonnement.js"></script>
</body>
</html>
