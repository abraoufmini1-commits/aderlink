<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a3f8a">
<title>ADER LINK · Utilisateurs</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ADER LINK">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="utilisateurs">
<div class="demo-banner" id="demoBanner" hidden>Démonstration — données fictives</div>
<main>
  <div class="page-head">
    <div>
      <h1>Utilisateurs</h1>
      <p class="subtitle">Vos gérants et vos clients : routeurs, abonnements et ventes.</p>
    </div>
    <button class="btn" type="button" id="addBtn">+ Ajouter</button>
  </div>
  <div class="seg u-tabs" role="tablist" aria-label="Type de compte">
    <button type="button" role="tab" id="tabClients" aria-pressed="true" aria-controls="clientsBox">Gérants <span class="num" id="nClients"></span></button>
    <button type="button" role="tab" id="tabStaff" aria-pressed="false" aria-controls="staffBox">Clients <span class="num" id="nStaff"></span></button>
  </div>

  <section id="clientsBox" aria-label="Tableau des gérants">
    <div class="u-summary" id="cSummary"></div>
    <label class="search"><span class="sr-only">Rechercher un gérant</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="cSearch" type="search" placeholder="Rechercher un gérant (nom, identifiant, téléphone)…" autocomplete="off"></label>
    <div class="card ctable-card"><div class="table-scroll"><table class="ctable">
      <thead><tr><th>Gérant</th><th>Routeurs</th><th>Abonnement</th><th class="r">Ventes du mois</th><th class="r">Actions</th></tr></thead>
      <tbody id="cRows"><tr><td colspan="5" class="pane-sub">Chargement…</td></tr></tbody>
    </table></div></div>
  </section>

  <section id="staffBox" hidden aria-label="Clients">
    <div class="role-help card">
            <div><strong>Client</strong> — crée et imprime ses tickets avec son propre point de vente. Il ne voit que ses lots et ses ventes.</div>
    </div>
    <section class="router-cards" id="list" aria-live="polite"></section>
  </section>
</main>

<div class="bs-shade" id="bsShade"></div>
<section class="bs" id="bs" role="dialog" aria-modal="true" aria-labelledby="bsTitle" hidden>
  <div class="bs-head">
    <span class="bs-ico" id="bsIco" aria-hidden="true"></span>
    <h2 id="bsTitle"></h2>
    <button class="icon-btn icon-btn-plain" type="button" id="bsClose" aria-label="Fermer"></button>
  </div>
  <div class="bs-body" id="bsBody"></div>
  <div class="bs-foot" id="bsFoot"></div>
</section>

<script src="/static/shell.js"></script>
<script src="/static/utilisateurs.js"></script>
</body>
</html>
