<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a3f8a">
<title>ADER LINK · Connexion</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ADER LINK">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-page">
  <form class="card login-card" method="post" action="/login" autocomplete="on">
    <div class="login-lockup">
      <span class="lockup-mark"><img src="/static/mark-white.svg" alt="" width="34" height="38"></span>
      <span class="lockup-text"><img src="/static/wordmark-blue.svg" alt="ADER LINK" width="190" height="25">
        <span class="lockup-tag">Gestion de zones Wi-Fi</span></span>
    </div>
    <div class="alert alert-error" id="err" role="alert"></div>
    <div class="alert alert-expired" id="expired" role="alert">
      <strong>Votre abonnement est terminé.</strong>
      <span>Pour continuer à utiliser ADER LINK, contactez <span id="expWho">votre fournisseur</span> pour le renouveler.</span>
      <span class="exp-contact" id="expContact" hidden>
        <a class="btn btn-sm" id="expWa" href="#" target="_blank" rel="noopener">WhatsApp</a>
        <a class="btn btn-sm btn-outline" id="expCall" href="#">Appeler</a>
      </span>
    </div>
    <div class="alert alert-info" id="demo">Mode démonstration : identifiant <strong>admin</strong>, mot de passe <strong>aderlink</strong></div>
    <label class="field"><span>Identifiant</span>
      <input name="username" autocomplete="username" required autofocus></label>
    <label class="field"><span>Mot de passe</span>
      <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Se connecter</button>
  </form>
</div>
<script src="/static/login.js"></script>
</body>
</html>
